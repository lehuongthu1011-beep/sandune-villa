name: Sync OTA calendars (backup)

# Đồng bộ chính giờ chạy ở Cloudflare Worker (worker/, mỗi phút, web đọc
# trực tiếp — xem worker/README.md). Workflow này chỉ chạy vài tiếng/lần để
# làm mới content/unavailable-dates.json — bản dự phòng khi trình duyệt
# khách không gọi được Worker, không phải nguồn chính nữa.

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lấy lịch từ Airbnb/Agoda/Booking.com
        run: node scripts/sync-ota-calendars.mjs
        env:
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
          AGODA_ICAL_URL: ${{ secrets.AGODA_ICAL_URL }}
          BOOKING_ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}
          CTRIP_ICAL_URL: ${{ secrets.CTRIP_ICAL_URL }}

      - name: Commit nếu có thay đổi
        run: |
          git config user.name "sandune-bot"
          git config user.email "noreply@sandunevilla.vn"
          if ! git diff --quiet -- content/unavailable-dates.json; then
            git add content/unavailable-dates.json
            git commit -m "Làm mới bản dự phòng lịch OTA"
            git push
          else
            echo "Không có thay đổi"
          fi

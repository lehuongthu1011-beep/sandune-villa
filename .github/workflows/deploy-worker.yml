name: Deploy Worker

# Chạy tay: trên GitHub vào tab Actions, chọn "Deploy Worker", bấm "Run workflow".
# Đưa code trong thư mục worker lên Cloudflare, rồi cập nhật các secret của
# Worker từ GitHub Secrets có tên bắt đầu bằng WORKER_ (secret nào chưa đặt thì
# bỏ qua, secret cũ trên Cloudflare giữ nguyên).
#
# Cần sẵn 2 secret đã dùng cho deploy.yml: CLOUDFLARE_API_TOKEN và
# CLOUDFLARE_ACCOUNT_ID. Mã CLOUDFLARE_API_TOKEN phải có quyền sửa Workers.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Triển khai Worker
        working-directory: worker
        run: npx --yes wrangler@4 deploy

      - name: Cập nhật secret của Worker
        working-directory: worker
        env:
          WORKER_CMS_GITHUB_TOKEN: ${{ secrets.WORKER_CMS_GITHUB_TOKEN }}
          WORKER_CMS_ALLOWED_EMAILS: ${{ secrets.WORKER_CMS_ALLOWED_EMAILS }}
          WORKER_OTP_MAIL_URL: ${{ secrets.WORKER_OTP_MAIL_URL }}
          WORKER_OTP_MAIL_SECRET: ${{ secrets.WORKER_OTP_MAIL_SECRET }}
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/worker-secrets.json"
          import json, os
          names = ["CMS_GITHUB_TOKEN", "CMS_ALLOWED_EMAILS", "OTP_MAIL_URL", "OTP_MAIL_SECRET"]
          print(json.dumps({n: os.environ["WORKER_" + n] for n in names if os.environ.get("WORKER_" + n)}))
          PY
          COUNT=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' "$RUNNER_TEMP/worker-secrets.json")
          if [ "$COUNT" = "0" ]; then
            echo "Chưa có secret WORKER_* nào, bỏ qua bước này."
          else
            echo "Cập nhật $COUNT secret của Worker."
            npx --yes wrangler@4 secret bulk "$RUNNER_TEMP/worker-secrets.json"
          fi
          rm -f "$RUNNER_TEMP/worker-secrets.json"
